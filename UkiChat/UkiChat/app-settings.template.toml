[database]
password = "your_database_password"
# Twitch: только реквизиты приложения с dev.twitch.tv.
# Токен чата и токен аккаунта СЮДА НЕ КЛАДЁМ — они вшиваются в exe вместе с этим файлом
# (EmbeddedResource) и достаются из сборки без декомпилятора. Доступ к чату и Helix
# выдаётся OAuth-авторизацией пользователя и хранится только в локальной БД.
[twitch]
api_client_id = "your_api_client_id"
api_client_secret = "your_api_client_secret"
[vk_video_live]
api_client_id = "your_api_client_id"
api_client_secret = "your_api_client_secret"
[donation_alerts]
client_id = "your_client_id"
client_secret = "your_client_secret"